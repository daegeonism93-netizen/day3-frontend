<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 미세먼지 · 두리샵</title>
<style>
  :root { --bg:#fff8f1; --ink:#2b2118; --muted:#7a6a5c; --card:#fff; --line:#efe1d3; --accent:#d9663a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:0 16px; }
  header { padding:18px 0 8px; display:flex; align-items:center; gap:12px; justify-content:space-between; }
  header a { color:var(--accent); text-decoration:none; font-weight:700; }
  h1 { font-size:1.35rem; margin:8px 0 4px; }
  .sub { color:var(--muted); font-size:.9rem; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .sum { display:flex; flex-wrap:wrap; gap:18px; align-items:baseline; }
  .big { font-size:2rem; font-weight:800; }
  .badge { display:inline-block; color:#fff; border-radius:8px; padding:1px 9px; font-size:.85rem; font-weight:700; }
  .g-좋음 { background:#2f80ed; } .g-보통 { background:#27ae60; } .g-나쁨 { background:#f2994a; } .g-매우나쁨 { background:#eb5757; }
  table { width:100%; border-collapse:collapse; font-size:.95rem; }
  th, td { text-align:left; padding:9px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:.82rem; }
  button { font:inherit; cursor:pointer; border:1px solid var(--accent); background:#fff; color:var(--accent); border-radius:8px; padding:4px 10px; }
  button:hover { background:var(--accent); color:#fff; }
  #pred { margin-top:10px; padding:12px; background:#fff3e8; border-radius:10px; display:none; }
  #alert { background:#fde5e5; border-radius:10px; padding:10px 14px; margin-bottom:12px; display:none; }
  small { color:var(--muted); }
  @media (max-width:480px) { .hide-s { display:none; } .big { font-size:1.6rem; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="./">← 두리샵으로</a>
    <small id="mode"></small>
  </header>
  <h1>🌫️ 제주 미세먼지</h1>
  <p class="sub">공공데이터(에어코리아) → FastAPI가 가공 → Supabase에 저장 → 이 화면은 결과만 보여줘요</p>

  <div id="alert"></div>

  <div class="card" id="summary">불러오는 중…</div>

  <div class="card">
    <table>
      <thead><tr><th>측정소</th><th class="hide-s">시각</th><th>PM10</th><th>PM2.5</th><th>예측</th></tr></thead>
      <tbody id="rows"><tr><td colspan="5">불러오는 중…</td></tr></tbody>
    </table>
    <div id="pred"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
(function () {
  "use strict";
  var API = window.API_URL;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var badge = function (g) { return g ? '<span class="badge g-' + esc(g) + '">' + esc(g) + "</span>" : "-"; };

  function get(path) {
    return fetch(API + path).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) throw new Error(d.detail || ("서버 오류 (" + r.status + ")"));
        return d;
      });
    });
  }
  function showError(e) {
    var box = $("alert");
    box.textContent = "⚠️ " + (e instanceof TypeError ? "서버에 연결할 수 없어요. 잠시 후 다시 시도해 주세요." : e.message);
    box.style.display = "block";
  }

  function load() {
    Promise.all([get("/air/summary"), get("/air/latest")]).then(function (r) {
      var s = r[0], rows = r[1];
      $("mode").textContent = s.mode === "demo" ? "연습 데이터" : "실시간 에어코리아";
      if (!rows.length) {
        $("summary").innerHTML = "아직 수집된 데이터가 없어요. 잠시 후 다시 확인해 주세요.";
        $("rows").innerHTML = '<tr><td colspan="5">데이터 없음</td></tr>';
        return;
      }
      $("summary").innerHTML =
        '<div class="sum"><span>제주 평균 PM10</span><span class="big">' + esc(s.avg_pm10 == null ? "-" : s.avg_pm10) + "</span>" +
        badge(s.avg_pm10_grade) + "<small>측정소 " + esc(s.stations) + "곳" +
        (s.worst_station ? " · 가장 높은 곳 " + esc(s.worst_station.station) + " " + esc(s.worst_station.pm10) : "") + "</small></div>";
      $("rows").innerHTML = rows.map(function (x) {
        return "<tr><td>" + esc(x.station) + '</td><td class="hide-s">' + esc(x.time.slice(11)) + "</td>" +
          "<td>" + esc(x.pm10 == null ? "-" : x.pm10) + " " + badge(x.pm10_grade) + "</td>" +
          "<td>" + esc(x.pm25 == null ? "-" : x.pm25) + " " + badge(x.pm25_grade) + "</td>" +
          '<td><button type="button" data-st="' + esc(x.station) + '">1시간 뒤?</button></td></tr>';
      }).join("");
    }).catch(showError);
  }

  $("rows").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-st]");
    if (!b) return;
    var st = b.getAttribute("data-st");
    var box = $("pred");
    box.style.display = "block";
    box.textContent = st + " 예측 중…";
    get("/air/predict?station=" + encodeURIComponent(st)).then(function (p) {
      box.innerHTML = p.ready
        ? "<b>" + esc(p.station) + "</b> 1시간 뒤 PM10 약 <b>" + esc(p.next_pm10) + "</b> " + badge(p.next_grade) +
          " <small>(평균 오차 ±" + esc(p.avg_error) + ")</small>"
        : "<b>" + esc(st) + "</b> — " + esc(p.message);
    }).catch(function (err) { box.textContent = "예측 실패: " + err.message; });
  });

  load();
})();
</script>
</body>
</html>
