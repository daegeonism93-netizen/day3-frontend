<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 미세먼지 · 두리샵</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#fff8f1; --ink:#2b2118; --muted:#7a6a5c; --card:#fff; --line:#efe1d3; --accent:#d9663a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:0 16px; }
  header { padding:18px 0 8px; display:flex; align-items:center; gap:12px; justify-content:space-between; }
  header a { color:var(--accent); text-decoration:none; font-weight:700; }
  h1 { font-size:1.35rem; margin:8px 0 4px; }
  .sub { color:var(--muted); font-size:.9rem; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .sum { display:flex; flex-wrap:wrap; gap:18px; align-items:baseline; }
  .big { font-size:2rem; font-weight:800; }
  .badge { display:inline-block; color:#fff; border-radius:8px; padding:1px 9px; font-size:.85rem; font-weight:700; }
  .g-좋음 { background:#2f80ed; } .g-보통 { background:#27ae60; } .g-나쁨 { background:#f2994a; } .g-매우나쁨 { background:#eb5757; }
  table { width:100%; border-collapse:collapse; font-size:.95rem; }
  th, td { text-align:left; padding:9px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:.82rem; }
  button { font:inherit; cursor:pointer; border:1px solid var(--accent); background:#fff; color:var(--accent); border-radius:8px; padding:4px 10px; }
  button:hover { background:var(--accent); color:#fff; }
  #pred { margin-top:10px; padding:12px; background:#fff3e8; border-radius:10px; display:none; }
  #alert { background:#fde5e5; border-radius:10px; padding:10px 14px; margin-bottom:12px; display:none; }
  small { color:var(--muted); }
  #map { height:420px; border-radius:12px; margin-top:8px; z-index:0; }
  .pop { line-height:1.75; font-size:.92rem; }
  .pop button { margin-top:4px; }
  @media (max-width:480px) { .hide-s { display:none; } .big { font-size:1.6rem; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="./">← 두리샵으로</a>
    <small id="mode"></small>
  </header>
  <h1>🌫️ 제주 미세먼지</h1>
  <p class="sub">공공데이터(에어코리아) → FastAPI가 가공 → Supabase에 저장 → 이 화면은 결과만 보여줘요</p>

  <div id="alert"></div>

  <div class="card" id="summary">불러오는 중…</div>

  <div class="card">
    <b>🗺️ 지도를 눌러 보세요 — 가장 가까운 측정소의 미세먼지</b>
    <div id="map"></div>
    <small>동그라미 색 = PM10 등급 · 지도 © OpenStreetMap</small>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>측정소</th><th class="hide-s">시각</th><th>PM10</th><th>PM2.5</th><th>예측</th></tr></thead>
      <tbody id="rows"><tr><td colspan="5">불러오는 중…</td></tr></tbody>
    </table>
    <div id="pred"></div>
  </div>

  <div class="card" id="chartCard">
    <b id="chartTitle">시간별 PM10 기록과 다음 1시간 예측</b>
    <div id="chart" style="margin-top:8px">측정소의 "1시간 뒤?" 버튼을 눌러 보세요.</div>
    <small id="chartNote"></small>
  </div>
</div>

<script src="config.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  "use strict";
  var API = window.API_URL;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var badge = function (g) { return g ? '<span class="badge g-' + esc(g) + '">' + esc(g) + "</span>" : "-"; };

  function get(path) {
    return fetch(API + path).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) throw new Error(d.detail || ("서버 오류 (" + r.status + ")"));
        return d;
      });
    });
  }
  function showError(e) {
    var box = $("alert");
    box.textContent = "⚠️ " + (e instanceof TypeError ? "서버에 연결할 수 없어요. 잠시 후 다시 시도해 주세요." : e.message);
    box.style.display = "block";
  }


  // ── [지도] 측정소 동그라미 + 누른 곳에서 가장 가까운 측정소 말풍선 ──
  var COLOR = { "좋음": "#2f80ed", "보통": "#27ae60", "나쁨": "#f2994a", "매우나쁨": "#eb5757" };
  var map = L.map("map").setView([33.38, 126.55], 10);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18, attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  function drawStations(rows) {
    rows.filter(function (r) { return r.lat != null && r.lng != null; }).forEach(function (r) {
      L.circleMarker([r.lat, r.lng], {
        radius: 10, color: "#fff", weight: 2, fillColor: COLOR[r.pm10_grade] || "#999", fillOpacity: 0.9
      }).bindTooltip(esc(r.station) + " PM10 " + esc(r.pm10 == null ? "-" : r.pm10))
        .on("click", function (e) { pick(e.latlng); })
        .addTo(map);
    });
  }

  function pick(latlng) {
    var pop = L.popup().setLatLng(latlng).setContent("불러오는 중…").openOn(map);
    get("/air/near?lat=" + latlng.lat + "&lng=" + latlng.lng).then(function (d) {
      pop.setContent(
        '<div class="pop"><b>' + esc(d.station) + "</b> 측정소 <small>(여기서 " + esc(d.distance_km) + "km · " + esc(String(d.time).slice(11)) + ")</small><br>" +
        "미세먼지 PM10 <b>" + esc(d.pm10 == null ? "-" : d.pm10) + "</b> " + badge(d.pm10_grade) + "<br>" +
        "초미세먼지 PM2.5 <b>" + esc(d.pm25 == null ? "-" : d.pm25) + "</b> " + badge(d.pm25_grade) + "<br>" +
        '<span class="pp"><button type="button" data-pst="' + esc(d.station) + '">1시간 뒤?</button></span></div>'
      );
    }).catch(function (err) {
      pop.setContent('<span style="color:#c0392b">' + esc(err instanceof TypeError ? "서버에 연결할 수 없어요" : err.message) + "</span>");
    });
  }
  map.on("click", function (e) { pick(e.latlng); });

  // 말풍선 안의 "1시간 뒤?" 버튼
  $("map").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-pst]");
    if (!b) return;
    var span = b.parentNode, st = b.getAttribute("data-pst");
    span.textContent = "예측 중…";
    get("/air/predict?station=" + encodeURIComponent(st)).then(function (p) {
      span.innerHTML = p.ready
        ? "1시간 뒤 PM10 약 <b>" + esc(p.next_pm10) + "</b> " + badge(p.next_grade) + " <small>(±" + esc(p.avg_error) + ")</small>"
        : esc(p.message);
    }).catch(function (err) { span.textContent = "예측 실패: " + err.message; });
  });

  function load() {
    Promise.all([get("/air/summary"), get("/air/latest")]).then(function (r) {
      var s = r[0], rows = r[1];
      drawStations(rows);
      $("mode").textContent = s.mode === "demo" ? "연습 데이터" : "실시간 에어코리아";
      if (!rows.length) {
        $("summary").innerHTML = "아직 수집된 데이터가 없어요. 잠시 후 다시 확인해 주세요.";
        $("rows").innerHTML = '<tr><td colspan="5">데이터 없음</td></tr>';
        return;
      }
      $("summary").innerHTML =
        '<div class="sum"><span>제주 평균 PM10</span><span class="big">' + esc(s.avg_pm10 == null ? "-" : s.avg_pm10) + "</span>" +
        badge(s.avg_pm10_grade) + "<small>측정소 " + esc(s.stations) + "곳" +
        (s.worst_station ? " · 가장 높은 곳 " + esc(s.worst_station.station) + " " + esc(s.worst_station.pm10) : "") + "</small></div>";
      $("rows").innerHTML = rows.map(function (x) {
        return "<tr><td>" + esc(x.station) + '</td><td class="hide-s">' + esc(x.time.slice(11)) + "</td>" +
          "<td>" + esc(x.pm10 == null ? "-" : x.pm10) + " " + badge(x.pm10_grade) + "</td>" +
          "<td>" + esc(x.pm25 == null ? "-" : x.pm25) + " " + badge(x.pm25_grade) + "</td>" +
          '<td><button type="button" data-st="' + esc(x.station) + '">1시간 뒤?</button></td></tr>';
      }).join("");
      var first = document.querySelector("#rows button[data-st]");  // 처음엔 가장 높은 측정소의 그래프를 보여 준다
      if (first) first.click();
    }).catch(showError);
  }

  // ── 시계열 차트: DB에 쌓인 기록(실선) + 다음 1시간 예측(빨간 점선) ──
  function drawChart(h) {
    var pts = h.points.filter(function (p) { return p.pm10 != null; });
    var pr = h.prediction;
    if (pts.length < 2) { $("chart").textContent = "그래프를 그릴 기록이 아직 부족해요."; return; }
    var W = 640, H = 240, L = 40, R = 16, T = 14, B = 34;
    var vals = pts.map(function (p) { return p.pm10; });
    if (pr.ready) vals.push(pr.next_pm10);
    var max = Math.max(40, Math.max.apply(null, vals) * 1.15);
    var n = pts.length + (pr.ready ? 1 : 0);
    var x = function (i) { return L + (W - L - R) * (n === 1 ? 0 : i / (n - 1)); };
    var y = function (v) { return T + (H - T - B) * (1 - v / max); };
    var s = '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%;height:auto" role="img" aria-label="PM10 시계열 그래프">';
    [[30, "좋음 30"], [80, "보통 80"]].forEach(function (g) {
      if (g[0] < max) s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(g[0]) + '" y2="' + y(g[0]) + '" stroke="#e6d6c5" stroke-dasharray="3 4"/>' +
        '<text x="' + (L - 4) + '" y="' + (y(g[0]) + 4) + '" font-size="10" text-anchor="end" fill="#7a6a5c">' + g[0] + "</text>";
    });
    s += '<line x1="' + L + '" x2="' + L + '" y1="' + T + '" y2="' + (H - B) + '" stroke="#cdbba8"/>' +
         '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + (H - B) + '" y2="' + (H - B) + '" stroke="#cdbba8"/>';
    var line = pts.map(function (p, i) { return x(i) + "," + y(p.pm10); }).join(" ");
    s += '<polyline points="' + line + '" fill="none" stroke="#2f80ed" stroke-width="2.5" stroke-linejoin="round"/>';
    pts.forEach(function (p, i) { s += '<circle cx="' + x(i) + '" cy="' + y(p.pm10) + '" r="3" fill="#2f80ed"><title>' + esc(p.time) + " PM10 " + p.pm10 + "</title></circle>"; });
    var step = Math.max(1, Math.ceil(pts.length / 6));
    pts.forEach(function (p, i) {
      if (i % step === 0) s += '<text x="' + x(i) + '" y="' + (H - 14) + '" font-size="10" text-anchor="middle" fill="#7a6a5c">' + esc(p.time.slice(5, 16)) + "</text>";
    });
    if (pr.ready) {
      var li = pts.length - 1, pi = pts.length;
      s += '<line x1="' + x(li) + '" y1="' + y(pts[li].pm10) + '" x2="' + x(pi) + '" y2="' + y(pr.next_pm10) + '" stroke="#eb5757" stroke-width="2.5" stroke-dasharray="6 5"/>' +
           '<circle cx="' + x(pi) + '" cy="' + y(pr.next_pm10) + '" r="5" fill="#fff" stroke="#eb5757" stroke-width="2.5"><title>예측 PM10 ' + pr.next_pm10 + "</title></circle>" +
           '<text x="' + x(pi) + '" y="' + (y(pr.next_pm10) - 10) + '" font-size="11" text-anchor="middle" fill="#eb5757" font-weight="700">예측 ' + pr.next_pm10 + "</text>";
    }
    $("chart").innerHTML = s + "</svg>";
    $("chartTitle").textContent = h.station + " · 시간별 PM10 기록과 다음 1시간 예측";
    $("chartNote").innerHTML = "DB에 저장된 기록 " + esc(h.count) + "개 (" + esc(pts[0].time) + " ~ " + esc(pts[pts.length - 1].time) + ")" +
      (pr.ready ? " · 예측 방법: " + esc(pr.model) : "");
  }

  $("rows").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-st]");
    if (!b) return;
    var st = b.getAttribute("data-st");
    var box = $("pred");
    box.style.display = "block";
    box.textContent = st + " 예측 중…";
    get("/air/history?hours=48&station=" + encodeURIComponent(st)).then(function (h) {
      var p = h.prediction;
      box.innerHTML = p.ready
        ? "<b>" + esc(st) + "</b> 1시간 뒤 PM10 약 <b>" + esc(p.next_pm10) + "</b> " + badge(p.next_grade) +
          " <small>(평균 오차 ±" + esc(p.avg_error) + ")</small>"
        : "<b>" + esc(st) + "</b> — " + esc(p.message);
      drawChart(h);
    }).catch(function (err) { box.textContent = "예측 실패: " + err.message; });
  });

  load();
})();
</script>
</body>
</html>
